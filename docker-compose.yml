version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: xyphx_mongodb_container
    ports:
      - "27017:27017"
    volumes:
      - xyphx_mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - xyphx_network

  backend:
    image: xyphx-backend:latest
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: xyphx_backend_container
    ports:
      - "8002:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=xyphx
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - xyphx_network

  frontend:
    image: xyphx-frontend:latest
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://${SERVER_IP:-localhost}:8002/api
        - VITE_WS_URL=ws://${SERVER_IP:-localhost}:8002/ws/live
    container_name: xyphx_frontend_container
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - xyphx_network

volumes:
  xyphx_mongodb_data:
    name: xyphx_mongodb_data_volume

networks:
  xyphx_network:
    name: xyphx_internal_network
