version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: xyphx-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: xyphx-backend
    ports:
      - "8001:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=xyphx
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8001/api
        - VITE_WS_URL=ws://localhost:8001/ws/live
    container_name: xyphx-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
